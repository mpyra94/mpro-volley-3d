<script>(function(){var t='light';try{t=localStorage.getItem('mpv:theme')||'light';}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #e9eff8; --glass: rgba(255, 255, 255, 0.96); --line: #d3dff0; --text: #0e1b3d; --muted: #5a6b88;
    --accent: #ff8a00; --field: #ffffff;
    --font: "Exo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1220; --glass: rgba(17, 26, 42, 0.96); --line: #27364d; --text: #e6edf7; --muted: #93a3bd; --field: #1a2638;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  button { font: inherit; font-weight: 600; cursor: pointer; }

  /* ---------- Pasek aplikacji ---------- */
  header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap; color: #fff;
    background: linear-gradient(115deg, #071a52 0%, #0c3fd0 60%, #1b8cff 100%); box-shadow: 0 8px 20px -12px rgba(7, 26, 82, .8); }
  header h1 { font-size: 19px; margin: 0; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .02em; flex: 1; min-width: 140px; }
  header a { text-decoration: none; }
  header button { color: #fff; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .45); border-radius: 9px; padding: 6px 12px; }
  header button:hover:not(:disabled) { background: rgba(255, 255, 255, .3); border-color: #ffd60a; }
  header button:disabled { opacity: .4; cursor: default; }
  header button.primary { background: #ffd60a; color: #0e1b3d; border-color: #ffd60a; }

  /* ---------- Pasek narzędzi ---------- */
  #tb { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px;
    background: var(--glass); border-bottom: 1px solid var(--line); box-shadow: 0 6px 16px -12px rgba(7, 26, 82, .7); }
  #tb .grp { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  #tb .sep { width: 1px; height: 26px; background: var(--line); }
  #tb .lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #tb button, #tb select { font-size: 13px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
  #tb button:hover:not(:disabled) { border-color: var(--accent); }
  #tb button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #tb button:disabled { opacity: .4; cursor: default; }
  #activeLbl { font-size: 12.5px; font-weight: 700; color: var(--text); padding: 3px 9px; border-radius: 999px; background: var(--field); border: 1px dashed var(--line); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sws { display: flex; gap: 4px; align-items: center; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); flex: none; }
  .sw:hover { transform: scale(1.12); }
  .sw.on { outline: 3px solid var(--accent); outline-offset: 1px; }
  #zoomVal { min-width: 46px; text-align: center; font-weight: 700; font-size: 13px; }

  /* ---------- Scena ---------- */
  #stage { --s: 1; padding: 18px 12px 60px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .pageWrap { width: calc(794px * var(--s)); height: calc(1123px * var(--s)); flex: none; position: relative; }
  .pageNo { position: absolute; left: 0; top: -17px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* ---------- Strona A4 (zawsze jasna) ---------- */
  .page { position: absolute; left: 0; top: 0; width: 794px; height: 1123px; background: #fff; color: #14213d; overflow: hidden;
    font-family: var(--font); box-shadow: 0 12px 34px -12px rgba(7, 26, 82, .55); transform: scale(var(--s)); transform-origin: 0 0;
    --c1: #243a7c; --c2: #dc2429; --c3: #fcea1e; --bar: #243a7c; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .band { position: absolute; left: 22px; top: 62px; bottom: 62px; width: 24px; display: flex; flex-direction: column; }
  .band i { display: block; }
  .band i:nth-child(1) { flex: 56; background: var(--c1); } .band i:nth-child(2) { flex: 30; background: var(--c2); } .band i:nth-child(3) { flex: 14; background: var(--c3); }
  .bar { position: relative; margin: 0 0 0 22px; height: 26px; width: 700px; background: var(--bar); color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .02em;
    clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 100%, 0 100%); display: flex; align-items: center; padding-left: 80px; }
  .bar.first { margin-top: 62px; }
  .body { padding: 8px 36px 0 58px; }

  /* tekst edytowalny */
  [contenteditable] { outline: none; }
  .tx:empty::before, .rt:empty::before, .cell:empty::before { content: attr(data-ph); color: #9aa6bd; font-weight: 500; font-style: italic; }
  body:not(.printing) [contenteditable]:hover { background: rgba(255, 214, 10, .14); }
  body:not(.printing) [contenteditable]:focus { background: rgba(255, 214, 10, .22); box-shadow: 0 0 0 2px rgba(255, 138, 0, .55); border-radius: 3px; }
  .rt { font-size: 9.5px; line-height: 1.35; min-height: 14px; word-break: break-word; }
  .rt b { font-weight: 800; }
  .rt div, .rt p { margin: 0; }

  /* nagłówek meczu */
  .hdr { display: grid; grid-template-columns: 1fr 240px 1fr; align-items: start; padding: 20px 36px 0 58px; height: 62px; }
  .hdr .team { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 6px; }
  .hdr .team .logo { width: 82px; height: 66px; display: block; cursor: pointer; border-radius: 8px; margin-top: 8px; }
  .hdr .team .logo { position: relative; overflow: hidden; }
  /* logo zawsze w całości mieści się w ramce (nic nie jest ucinane) i nie wchodzi na tekst */
  .hdr .team .logo img, .foot img { position: absolute; left: 4px; top: 4px; width: calc(100% - 8px); height: calc(100% - 8px); object-fit: contain; display: block; }
  .hdr .team .nm { font-size: 13px; font-weight: 800; text-align: center; text-transform: uppercase; min-width: 80px; }
  .logo.empty { border: 2px dashed #b9c4d8; color: #9aa6bd; font-size: 10px; font-weight: 700; text-align: center; line-height: 1.2; }
  .cbox { background: var(--bar); color: #fff; text-align: center; border-radius: 3px; padding: 8px 6px 7px; margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .cbox .t1 { font-size: 14px; font-weight: 800; } .cbox .t2 { font-size: 13px; font-weight: 500; } .cbox .t3 { font-size: 9.5px; font-weight: 500; }
  .cbox [contenteditable]:hover, .cbox [contenteditable]:focus { background: rgba(255, 255, 255, .18); }
  .vs { text-align: center; font-size: 12px; font-weight: 800; margin-top: 8px; }

  /* strona 1 */
  .p1head { height: 92px; }
  .row1 { display: flex; gap: 10px; padding: 8px 36px 6px 58px; height: 226px; }
  .fbox { position: relative; width: 272px; flex: none; border: 1.5px solid #14213d; }
  .fbox svg { display: block; width: 100%; height: 100%; }
  .rotLbl { position: absolute; left: 8px; bottom: 5px; font-size: 20px; font-weight: 800; background: rgba(255, 255, 255, .85); padding: 0 4px; line-height: 1.1; }
  .libBox { width: 134px; flex: none; border: 1.5px solid #14213d; font-size: 10px; display: flex; flex-direction: column; }
  .libBox .lb1 { padding: 5px 7px 6px; border-bottom: 1.5px solid #14213d; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .libBox .lb1 .h { align-self: flex-start; font-weight: 600; }
  .libBox .lb2 { padding: 6px 7px; flex: 1; }
  .libBox .lb2 .h { font-weight: 600; margin-bottom: 4px; }
  .roleBox { flex: 1; border: 1.5px solid #14213d; background: #fffbe3; padding: 8px 10px; font-size: 10.5px; line-height: 1.4; }
  .sh { position: relative; width: 38px; height: 34px; display: grid; place-items: center; background: no-repeat center / contain; }
  .sh .n { font-size: 12px; font-weight: 800; min-width: 14px; text-align: center; margin-top: 2px; }
  .shLg { width: 44px; height: 40px; }

  /* dystrybucja */
  .distRow { padding: 2px 36px 4px 58px; position: relative; }
  .dHead { display: flex; align-items: baseline; gap: 14px; margin: 6px 0 4px; }
  .dHead .dt { font-size: 18px; font-weight: 500; text-align: left; min-width: 120px; }
  .dHead .dn { font-size: 14px; font-weight: 600; color: #d62828; text-align: left; }
  .dCards { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
  .dCard { position: relative; width: 158px; border: 2px solid #14213d; background: #fff; }
  .dCard .ct { font-size: 10.5px; font-weight: 800; color: #d62828; text-align: center; min-height: 15px; border-bottom: 1px solid #14213d; padding: 1px 2px; }
  .dGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 4px; background: #fff; }
  .tx.nm { display: block; }
  .cell { display: block; border: 1px solid #aab3c6; text-align: center; font-size: 10px; font-weight: 600; padding: 5px 0; min-height: 25px; background: #fff; }
  .cell.hi { border: 2.5px solid #d62828; }
  .dNet { height: 7px; border-top: 3px solid #14213d; border-bottom: 1px solid #aab3c6; margin: 2px 0; }
  .dCard .dn2 { border-top: 2px solid #14213d; padding: 4px 5px; min-height: 50px; }
  .dNote { flex: 1; min-width: 150px; font-size: 13px; font-weight: 500; align-self: center; padding: 6px 10px; }

  /* karty zawodników (atak / zagrywka) */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 14px; padding: 12px 36px 0 58px; }
  .card { position: relative; }
  .chead { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 2px; }
  .chead .nm { font-size: 13px; font-weight: 700; text-transform: uppercase; flex: 1; text-align: left; }
  .chead .sub { display: block; font-size: 8.5px; font-weight: 800; text-transform: uppercase; color: #3b4b6b; }
  .court { display: block; width: 100%; height: auto; border: 0; }
  .cnotes { border: 1px solid #aab3c6; border-top: 1.5px solid #14213d; padding: 5px 6px; min-height: 92px; }
  .cnotes.ctr { text-align: center; text-transform: uppercase; font-weight: 700; font-size: 8.8px; border: 0; border-top: 2px solid #14213d; border-bottom: 2px solid #14213d; min-height: 56px; }
  .legend { border: 1.5px solid #14213d; padding: 8px 10px; font-size: 9.5px; line-height: 1.4; align-self: center; }
  .legend .rt { font-size: 9.2px; }
  .ops { position: absolute; right: 0; top: -2px; display: none; gap: 2px; z-index: 5; }
  .card:hover .ops, .dCard:hover .ops, .dRowOps { display: flex; }
  .ops button, .addbtn, .dRowOps button { font-size: 11px; font-weight: 700; color: #14213d; background: #fff; border: 1px solid #aab3c6; border-radius: 6px; padding: 1px 6px; cursor: pointer; }
  .ops button:hover, .addbtn:hover, .dRowOps button:hover { border-color: #ff8a00; background: #fff3dc; }
  .addbar { padding: 6px 36px 0 58px; display: flex; gap: 6px; flex-wrap: wrap; }
  .dRowOps { display: flex; gap: 4px; position: absolute; right: 36px; top: 2px; }
  .foot { position: absolute; right: 34px; bottom: 20px; width: 92px; height: 66px; display: grid; place-items: center; cursor: pointer; }
  .foot { overflow: hidden; }
  .foot.empty { border: 2px dashed #c3cce0; border-radius: 8px; color: #b2bbd0; font-size: 9px; font-weight: 700; text-align: center; }

  /* rysunki na boisku (SVG) */
  svg.court .sp text { pointer-events: none; user-select: none; }
  svg.court { touch-action: none; }
  svg.court.act { outline: 2px solid rgba(255, 138, 0, .75); outline-offset: 1px; }

  /* okienka */
  #pop { position: fixed; z-index: 300; display: none; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 8px; gap: 6px; flex-direction: column;
    box-shadow: 0 12px 30px -8px rgba(7, 26, 82, .6); min-width: 190px; }
  #pop.show { display: flex; }
  #pop label { font-size: 11px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 2px; }
  #pop input { width: 100%; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
  #pop button { font-size: 12px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 400; background: rgba(14, 27, 61, .92); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    max-width: min(92vw, 560px); text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #toast.show { opacity: 1; }

  @media (max-width: 820px) { header h1 { font-size: 16px; } #tb { padding: 6px 8px; } }

  /* ---------- Wydruk / PDF ---------- */
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff !important; }
    header, #tb, #pop, #toast, .pageNo, .ops, .addbar, .dRowOps, .noprint { display: none !important; }
    #stage { padding: 0; gap: 0; display: block; }
    .pageWrap { width: 210mm !important; height: 296mm !important; margin: 0 !important; page-break-after: always; break-after: page; overflow: hidden; }
    .pageWrap:last-child { page-break-after: auto; break-after: auto; }
    .page { transform: none !important; box-shadow: none !important; width: 794px; height: 1122px; }
    [data-ph]:empty::before { content: '' !important; }
    .foot.empty, .logo.empty { visibility: hidden; }
    svg.court .ui { display: none; }
    svg.court.act { outline: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

  <div class="grp"><button type="button" id="copyBtn" title="Kopiuj zaznaczony kształt (bez zaznaczenia – wszystkie kształty aktywnego diagramu), Ctrl+C">⧉ Kopiuj</button><button type="button" id="pasteBtn" title="Wklej skopiowane kształty do aktywnego diagramu (Ctrl+V)">⎘ Wklej</button><button type="button" id="delShape" title="Usuń zaznaczony element (Delete)">🗑 Usuń</button><button type="button" id="clearCanvas" title="Wyczyść cały aktywny diagram">Wyczyść diagram</button></div>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">Tekst</span>
    <button type="button" data-cmd="bold" title="Pogrubienie (zaznacz tekst w polu notatek)"><b>B</b></button>

  <div class="grp"><span class="lbl">Widok</span><button type="button" id="zoomOut">−</button><span id="zoomVal">100%</span><button type="button" id="zoomIn">+</button><button type="button" id="zoomFit">Dopasuj</button></div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg', KEY = 'mpv:gameplan:doc:v2';
  var PAL = ['#d62828', '#f08a24', '#f2c230', '#7bbf6a', '#4a74c9', '#9ec5ea', '#222222', '#ffffff'];
  // szata graficzna: trzy kolory zespołu (c1 – paski sekcji i ramka nagłówka, c2 i c3 – środek i dół belki z lewej)
  // kolory wpisujesz jako hex; własne zestawy zapisują się w przeglądarce, a nowy gameplan startuje z ostatnio zapisanego
  var DEFAULT_THEME = ['#243a7c', '#dc2429', '#fcea1e'], THEMES_KEY = 'mpv:gameplan:themes:v1';
  function themeObj(t) { return { c1: t[0], c2: t[1], c3: t[2] }; }
  function loadThemes() { try { var l = JSON.parse(localStorage.getItem(THEMES_KEY) || '[]'); return Array.isArray(l) ? l.filter(function (s) { return Array.isArray(s) && s.length === 3 && s.every(function (c) { return /^#[0-9a-f]{6}$/i.test(c); }); }) : []; } catch (e) { return []; } }
  function saveThemes(l) { try { localStorage.setItem(THEMES_KEY, JSON.stringify(l)); } catch (e) {} }
  function startTheme() { var l = loadThemes(); return l.length ? l[l.length - 1] : DEFAULT_THEME; }
  var SHIRT_D = 'M-18 -10 L-8 -17 Q0 -11 8 -17 L18 -10 L13 -1 L9 -3 L9 15 L-9 15 L-9 -3 L-13 -1 Z';
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');
  var CE = (function () { var d = document.createElement('div'); try { d.contentEditable = 'plaintext-only'; } catch (e) {} return d.contentEditable === 'plaintext-only' ? 'plaintext-only' : 'true'; })();

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function getPath(o, p) { var a = p.split('.'); for (var i = 0; i < a.length; i++) { if (o == null) return undefined; o = o[a[i]]; } return o; }
  function setPath(o, p, v) { var a = p.split('.'); for (var i = 0; i < a.length - 1; i++) o = o[a[i]]; o[a[a.length - 1]] = v; }

      var k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); $('undoBtn').click(); } else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); $('redoBtn').click(); }
      else if (k === 'c' && !String(window.getSelection()).length) { e.preventDefault(); copyShapes(); }
      else if (k === 'v') { e.preventDefault(); pasteShapes(); }
      return;
    }
    if (editing) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); delSel(); }
    else if (e.key === 'Escape') { sel = null; conePts = null; cur = null; clearPreview(); closePop(); drawAll(); }
  });

  // ---------- Widok (zoom) ----------
  var zoom = 0; // 0 = dopasuj
  function fit() {
    var avail = Math.max(280, stage.clientWidth - 24), s = zoom || Math.min(1, avail / 794);
    stage.style.setProperty('--s', s.toFixed(3)); $('zoomVal').textContent = Math.round(s * 100) + '%';
  }
  $('zoomIn').addEventListener('click', function () { var s = parseFloat(stage.style.getPropertyValue('--s')) || 1; zoom = Math.min(2, Math.round((s + 0.1) * 100) / 100); fit(); });
  $('zoomOut').addEventListener('click', function () { var s = parseFloat(stage.style.getPropertyValue('--s')) || 1; zoom = Math.max(0.3, Math.round((s - 0.1) * 100) / 100); fit(); });
  $('zoomFit').addEventListener('click', function () { zoom = 0; fit(); });
  addEventListener('resize', function () { if (!zoom) fit(); });

  // ---------- Plik, nowy, PDF ----------
  $('newBtn').addEventListener('click', function () {
    if (!confirm('Utworzyć nowy, pusty gameplan? Bieżący zostanie zastąpiony (cofnięcie: Ctrl+Z).')) return;
    doc = defaultDoc(); sel = null; activePath = null; $('activeLbl').textContent = activeName(); renderAll(); commit();
  });
  $('saveBtn').addEventListener('click', function () {
    var d = new Date(), name = 'gameplan-' + d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + '.json';
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(doc)], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); toast('Zapisano plik ' + name);
  });
  $('loadBtn').addEventListener('click', function () { $('loadFile').value = ''; $('loadFile').click(); });
  $('loadFile').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return; var fr = new FileReader();
    fr.onload = function () {
      try { var d = JSON.parse(fr.result); if (!d || !d.p1 || !d.p2 || !d.p3 || !d.meta) throw new Error('bad'); doc = d; sel = null; renderAll(); commit(); toast('Wczytano gameplan.'); }
      catch (e) { toast('To nie jest poprawny plik gameplanu.'); }
    };
    fr.readAsText(f);
  });
  $('printBtn').addEventListener('click', function () {
    toast('W oknie drukowania wybierz „Zapisz jako PDF”, papier A4, marginesy: brak.');
    setTimeout(function () { document.body.classList.add('printing'); var a = document.activeElement; if (a && a.blur) a.blur(); window.print(); document.body.classList.remove('printing'); }, 350);
  });

  renderAll();
  hist = [JSON.stringify(doc)]; hi = 0; histOn = true; syncHist();
})();
</script>
</body>
</html>
