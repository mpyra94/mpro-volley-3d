<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gameplan – mPro Volley 3D</title>
<!-- © 2026 Michał Pyra · mPro Volley 3D. Wszelkie prawa zastrzeżone. Kopiowanie, rozpowszechnianie i odsprzedaż bez pisemnej zgody autora są zabronione. -->
<script>(function(){var t='light';try{t=localStorage.getItem('mpv:theme')||'light';}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #e9eff8; --glass: rgba(255, 255, 255, 0.96); --line: #d3dff0; --text: #0e1b3d; --muted: #5a6b88;
    --accent: #ff8a00; --field: #ffffff;
    --font: "Exo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1220; --glass: rgba(17, 26, 42, 0.96); --line: #27364d; --text: #e6edf7; --muted: #93a3bd; --field: #1a2638;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  button { font: inherit; font-weight: 600; cursor: pointer; }

  /* ---------- Pasek aplikacji ---------- */
  header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap; color: #fff;
    background: linear-gradient(115deg, #071a52 0%, #0c3fd0 60%, #1b8cff 100%); box-shadow: 0 8px 20px -12px rgba(7, 26, 82, .8); }
  header h1 { font-size: 19px; margin: 0; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .02em; flex: 1; min-width: 140px; }
  header a { text-decoration: none; }
  header button { color: #fff; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .45); border-radius: 9px; padding: 6px 12px; }
  header button:hover:not(:disabled) { background: rgba(255, 255, 255, .3); border-color: #ffd60a; }
  header button:disabled { opacity: .4; cursor: default; }
  header button.primary { background: #ffd60a; color: #0e1b3d; border-color: #ffd60a; }

  /* ---------- Pasek narzędzi ---------- */
  #tb { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px;
    background: var(--glass); border-bottom: 1px solid var(--line); box-shadow: 0 6px 16px -12px rgba(7, 26, 82, .7); }
  #tb .grp { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  #tb .sep { width: 1px; height: 26px; background: var(--line); }
  #tb .lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #tb button, #tb select { font-size: 13px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
  #tb button:hover:not(:disabled) { border-color: var(--accent); }
  #tb button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #tb button:disabled { opacity: .4; cursor: default; }
  #activeLbl { font-size: 12.5px; font-weight: 700; color: var(--text); padding: 3px 9px; border-radius: 999px; background: var(--field); border: 1px dashed var(--line); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sws { display: flex; gap: 4px; align-items: center; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); flex: none; }
  .sw:hover { transform: scale(1.12); }
  .sw.on { outline: 3px solid var(--accent); outline-offset: 1px; }
  #zoomVal { min-width: 46px; text-align: center; font-weight: 700; font-size: 13px; }
  /* ustawienia widoku: pływający pasek na dole – nie zajmuje miejsca w obszarze roboczym */
  #viewBar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 6px; padding: 5px 10px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 8px 22px -8px rgba(7, 26, 82, .65); }
  #viewBar .lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #viewBar button { font-size: 13px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
  #viewBar button:hover { border-color: var(--accent); }

  /* ---------- Scena ---------- */
  #stage { --s: 1; padding: 18px 12px 60px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .pageWrap { width: calc(794px * var(--s)); height: calc(1123px * var(--s)); flex: none; position: relative; }
  .pageNo { position: absolute; left: 0; top: -17px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* ---------- Strona A4 (zawsze jasna) ---------- */
  .page { position: absolute; left: 0; top: 0; width: 794px; height: 1123px; background: #fff; color: #14213d; overflow: hidden;
    font-family: var(--font); box-shadow: 0 12px 34px -12px rgba(7, 26, 82, .55); transform: scale(var(--s)); transform-origin: 0 0;
    --c1: #243a7c; --c2: #dc2429; --c3: #fcea1e; --bar: #243a7c; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .band { position: absolute; left: 22px; top: 62px; bottom: 62px; width: 24px; display: flex; flex-direction: column; }
  .band i { display: block; }
  .band i:nth-child(1) { flex: 56; background: var(--c1); } .band i:nth-child(2) { flex: 30; background: var(--c2); } .band i:nth-child(3) { flex: 14; background: var(--c3); }
  .bar { position: relative; margin: 0 0 0 22px; height: 26px; width: 700px; background: var(--bar); color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .02em;
    clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 100%, 0 100%); display: flex; align-items: center; padding-left: 80px; }
  .bar.first { margin-top: 62px; }
  .body { padding: 8px 36px 0 58px; }

  /* tekst edytowalny */
  [contenteditable] { outline: none; }
  .tx:empty::before, .rt:empty::before, .cell:empty::before { content: attr(data-ph); color: #9aa6bd; font-weight: 500; font-style: italic; }
  body:not(.printing) [contenteditable]:hover { background: rgba(255, 214, 10, .14); }
  body:not(.printing) [contenteditable]:focus { background: rgba(255, 214, 10, .22); box-shadow: 0 0 0 2px rgba(255, 138, 0, .55); border-radius: 3px; }
  .rt { font-size: 9.5px; line-height: 1.35; min-height: 14px; word-break: break-word; }
  .rt b { font-weight: 800; }
  .rt div, .rt p { margin: 0; }

  /* nagłówek meczu */
  .hdr { display: grid; grid-template-columns: 1fr 240px 1fr; align-items: start; padding: 20px 36px 0 58px; height: 62px; }
  .hdr .team { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 6px; }
  .hdr .team .logo { width: 82px; height: 66px; display: block; cursor: pointer; border-radius: 8px; margin-top: 8px; }
  .hdr .team .logo { position: relative; overflow: hidden; }
  /* logo zawsze w całości mieści się w ramce (nic nie jest ucinane) i nie wchodzi na tekst */
  .hdr .team .logo img, .foot img { position: absolute; left: 4px; top: 4px; width: calc(100% - 8px); height: calc(100% - 8px); object-fit: contain; display: block; }
  .hdr .team .nm { font-size: 13px; font-weight: 800; text-align: center; text-transform: uppercase; min-width: 80px; }
  .logo.empty { border: 2px dashed #b9c4d8; color: #9aa6bd; font-size: 10px; font-weight: 700; text-align: center; line-height: 1.2; }
  .cbox { background: var(--bar); color: #fff; text-align: center; border-radius: 3px; padding: 8px 6px 7px; margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .cbox .t1 { font-size: 14px; font-weight: 800; } .cbox .t2 { font-size: 13px; font-weight: 500; } .cbox .t3 { font-size: 9.5px; font-weight: 500; }
  .cbox [contenteditable]:hover, .cbox [contenteditable]:focus { background: rgba(255, 255, 255, .18); }
  .vs { text-align: center; font-size: 12px; font-weight: 800; margin-top: 8px; }

  /* strona 1 */
  .p1head { height: 92px; }
  .row1 { display: flex; gap: 10px; padding: 8px 36px 6px 58px; height: 226px; }
  .fbox { position: relative; width: 272px; flex: none; border: 1.5px solid #14213d; }
  .fbox svg { display: block; width: 100%; height: 100%; }
  .rotSel { font: inherit; font-size: 20px; font-weight: 800; line-height: 1.1; color: #14213d; border: 0; background: transparent; padding: 0 2px; cursor: pointer; -webkit-appearance: none; appearance: none; outline: none; }
  body:not(.printing) .rotSel:hover, body:not(.printing) .rotSel:focus { background: rgba(255, 214, 10, .3); border-radius: 3px; }
  .rotLbl { position: absolute; left: 8px; bottom: 5px; font-size: 20px; font-weight: 800; background: rgba(255, 255, 255, .85); padding: 0 4px; line-height: 1.1; }
  .libBox { width: 134px; flex: none; border: 1.5px solid #14213d; font-size: 10px; display: flex; flex-direction: column; }
  .libBox .lb1 { padding: 5px 7px 6px; border-bottom: 1.5px solid #14213d; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .libBox .lb1 .h { align-self: flex-start; font-weight: 600; }
  .libBox .lb2 { padding: 6px 7px; flex: 1; }
  .libBox .lb2 .h { font-weight: 600; margin-bottom: 4px; }
  .subrow { display: flex; align-items: baseline; gap: 1px; font-size: 10px; font-weight: 700; margin-bottom: 3px; position: relative; flex-wrap: nowrap; }
  .subrow .hash { color: #14213d; flex: none; }
  .subrow .tx { display: inline-block; }
  .subrow .sn { min-width: 14px; } .subrow .snm { min-width: 30px; margin-left: 3px; } .subrow .spo { min-width: 10px; }
  .subrow .spo:not(:empty)::before { content: '– '; font-weight: 600; } /* separator tylko gdy jest pozycja */
  .subrow .spo { margin-left: 3px; }
  .subx { display: none; margin-left: auto; font-size: 10px; line-height: 1; color: #14213d; background: #fff; border: 1px solid #aab3c6; border-radius: 5px; padding: 1px 4px; cursor: pointer; }
  .subrow:hover .subx { display: inline-block; }
  .libBox .addbtn { font-size: 10px; }
  /* pola tekstowe w dowolnym miejscu strony */
  .tbox { position: absolute; z-index: 6; min-width: 40px; min-height: 24px; }
  body:not(.printing) .tbox { outline: 1px dashed rgba(14, 27, 61, .3); }
  .tbox.bd { border: 1.5px solid #14213d; background: #fff; }
  .tbox .tbt { width: 100%; height: 100%; padding: 3px 5px; overflow: hidden; line-height: 1.3; font-weight: 500; }
  .tbhd { position: absolute; left: -1px; top: -24px; display: none; gap: 3px; align-items: center; background: #fff; border: 1px solid #aab3c6; border-radius: 6px; padding: 2px 4px; cursor: move; white-space: nowrap; box-shadow: 0 4px 10px -4px rgba(14, 27, 61, .5); }
  .tbox:hover .tbhd, .tbox:focus-within .tbhd { display: flex; }
  .tbgrip { font-size: 11px; color: #5a6b88; letter-spacing: -2px; padding: 0 3px; user-select: none; }
  .tbhd button { font-size: 10px; font-weight: 700; border: 1px solid #aab3c6; border-radius: 4px; background: #fff; color: #14213d; padding: 0 5px; cursor: pointer; }
  .tbhd button:hover { border-color: #ff8a00; background: #fff3dc; }
  .tbrs { position: absolute; right: -6px; bottom: -6px; width: 13px; height: 13px; background: #ff8a00; border: 2px solid #fff; border-radius: 3px; cursor: nwse-resize; display: none; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); }
  .tbox:hover .tbrs, .tbox:focus-within .tbrs { display: block; }
  body.inserting .page { cursor: crosshair; }
  .roleBox { flex: 1; border: 1.5px solid #14213d; background: #fffbe3; padding: 8px 10px; font-size: 10.5px; line-height: 1.4; }
  .sh { position: relative; width: 38px; height: 34px; display: grid; place-items: center; background: no-repeat center / contain; }
  .sh .n { font-size: 12px; font-weight: 800; min-width: 14px; text-align: center; margin-top: 2px; }
  .shLg { width: 44px; height: 40px; }

  /* dystrybucja */
  .distRow { padding: 2px 36px 4px 58px; position: relative; }
  .dHead { display: flex; align-items: baseline; gap: 14px; margin: 6px 0 4px; }
  .dHead .dt { font-size: 18px; font-weight: 500; text-align: left; min-width: 120px; }
  .dHead .dn { font-size: 14px; font-weight: 600; color: #d62828; text-align: left; }
  .dCards { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
  .dCard { position: relative; width: 158px; border: 2px solid #14213d; background: #fff; }
  .dCard .ct { font-size: 10.5px; font-weight: 800; color: #d62828; text-align: center; min-height: 15px; border-bottom: 1px solid #14213d; padding: 1px 2px; }
  .dGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 4px; background: #fff; }
  .tx.nm { display: block; }
  .cell { display: block; border: 1px solid #aab3c6; text-align: center; font-size: 10px; font-weight: 600; padding: 5px 0; min-height: 25px; background: #fff; }
  .cell.hi { border: 2.5px solid #d62828; }
  .dNet { height: 7px; border-top: 3px solid #14213d; border-bottom: 1px solid #aab3c6; margin: 2px 0; }
  .dCard .dn2 { border-top: 2px solid #14213d; padding: 4px 5px; min-height: 50px; }
  .dNote { flex: 1; min-width: 150px; font-size: 13px; font-weight: 500; align-self: center; padding: 6px 10px; }

  /* karty zawodników (atak / zagrywka) */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 14px; padding: 12px 36px 0 58px; }
  .card { position: relative; }
  .chead { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 2px; }
  .chead .nm { font-size: 13px; font-weight: 700; text-transform: uppercase; flex: 1; text-align: left; }
  .chead .sub { display: block; font-size: 8.5px; font-weight: 800; text-transform: uppercase; color: #3b4b6b; }
  .court { display: block; width: 100%; height: auto; border: 0; }
  .grid.atk { padding-top: 2px; gap: 2px 14px; }
  .grid.atk .cnotes { min-height: 64px; }
  .secH { display: flex; align-items: center; gap: 10px; margin: 8px 36px 0 58px; padding: 0 0 2px; border-bottom: 1.5px solid var(--bar); }
  .secH .tx { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--bar); text-transform: uppercase; min-width: 60px; }
  .secOps { display: flex; gap: 4px; margin-left: auto; }
  .cw { position: relative; }
  .ballSel { position: absolute; transform: translate(-50%, -105%); font: inherit; font-size: 11px; font-weight: 800; line-height: 1.1; color: #d62828; background: #fff; border: 1.5px solid #d62828; border-radius: 6px; padding: 0 3px; text-align: center; text-align-last: center; -webkit-appearance: none; appearance: none; cursor: pointer; outline: none; min-width: 22px; z-index: 3; }
  .ballSel.empty { border-style: dashed; color: #9aa6bd; border-color: #b9c4d8; }
  .cnotes { border: 1px solid #aab3c6; border-top: 1.5px solid #14213d; padding: 5px 6px; min-height: 92px; }
  .cnotes.ctr { text-align: center; text-transform: uppercase; font-weight: 700; font-size: 8.8px; border: 0; border-top: 2px solid #14213d; border-bottom: 2px solid #14213d; min-height: 56px; }
  .legend { border: 1.5px solid #14213d; padding: 8px 10px; font-size: 9.5px; line-height: 1.4; align-self: center; }
  .legend .rt { font-size: 9.2px; }
  .ops { position: absolute; right: 0; top: -2px; display: none; gap: 2px; z-index: 5; }
  .card:hover .ops, .dCard:hover .ops, .dRowOps { display: flex; }
  .ops button, .addbtn, .dRowOps button { font-size: 11px; font-weight: 700; color: #14213d; background: #fff; border: 1px solid #aab3c6; border-radius: 6px; padding: 1px 6px; cursor: pointer; }
  .ops button:hover, .addbtn:hover, .dRowOps button:hover { border-color: #ff8a00; background: #fff3dc; }
  .addbar { padding: 6px 36px 0 58px; display: flex; gap: 6px; flex-wrap: wrap; }
  .dRowOps { display: flex; gap: 4px; position: absolute; right: 36px; top: 2px; }
  .foot { position: absolute; right: 34px; bottom: 20px; width: 92px; height: 66px; display: grid; place-items: center; cursor: pointer; }
  .foot { overflow: hidden; }
  .wm { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 8.5px; font-weight: 600; letter-spacing: .06em; color: #9aa6bd; pointer-events: none; }
  /* wiersz dystrybucji z więcej niż 4 kartami: karty kurczą się, aby zmieścić do 8 w jednym wierszu */
  .dCards.many { flex-wrap: nowrap; gap: 5px; }
  .dCards.many .dCard { flex: 1 1 0; min-width: 0; width: auto; }
  .dCards.many .ct { font-size: 8.5px; }
  .dCards.many .dGrid { padding: 3px; gap: 2px; }
  .dCards.many .cell { font-size: 8.5px; padding: 5px 0; min-height: 22px; overflow: hidden; }
  .dCards.many .dn2 .rt { font-size: 8px; }
  .foot img { opacity: .22; } /* stopka działa jak delikatny znak wodny */
  .foot.empty { border: 2px dashed #c3cce0; border-radius: 8px; color: #b2bbd0; font-size: 9px; font-weight: 700; text-align: center; }

  /* rysunki na boisku (SVG) */
  svg.court .sp text { pointer-events: none; user-select: none; }
  svg.court { touch-action: none; }
  svg.court.act { outline: 2px solid rgba(255, 138, 0, .75); outline-offset: 1px; }

  /* okienka */
  #pop { position: fixed; z-index: 300; display: none; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 8px; gap: 6px; flex-direction: column;
    box-shadow: 0 12px 30px -8px rgba(7, 26, 82, .6); min-width: 190px; }
  #pop.show { display: flex; }
  #pop label { font-size: 11px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 2px; }
  #pop input { width: 100%; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
  #pop button { font-size: 12px; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; }
  #toast { position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); z-index: 400; background: rgba(14, 27, 61, .92); color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    max-width: min(92vw, 560px); text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #toast.show { opacity: 1; }

  /* zwijanie menu rysowania */
  #tb .tbBody { display: contents; }
  #tb.collapsed .tbBody { display: none; }
  #tb .gHead { flex: 1; min-width: 0; flex-wrap: nowrap; }
  #tb #activeLbl { flex: 0 1 auto; min-width: 0; }
  #tb #tbToggle { margin-left: auto; flex: none; font-weight: 700; }
  header .ts { display: none; }
  @media (max-width: 820px) { header h1 { font-size: 16px; } #tb { padding: 6px 8px; max-height: 60vh; overflow-y: auto; } }
  /* widok mobilny: cały pasek w jednej linii (ikony), zwijane i zagęszczone narzędzia rysowania */
  @media (max-width: 700px) {
    header { flex-wrap: nowrap; gap: 5px; padding: 8px 8px; justify-content: space-between; }
    header h1 { display: none; }
    header .tl { display: none; }
    header .ts { display: inline; }
    header button { padding: 6px 9px; font-size: 14px; line-height: 1.1; }
    #tb { padding: 5px 8px; gap: 5px; }
    #tb .tbBody { display: flex; flex-wrap: wrap; gap: 5px 6px; width: 100%; }
    #tb.collapsed .tbBody { display: none; }
    #tb .sep { display: none; }
    #tb button, #tb select { font-size: 12px; padding: 4px 6px; }
    #tb #tools { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    #tb #tools button { padding: 5px 1px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
    #tb .tbBody > .grp:nth-child(2) { width: 100%; }
    #tb .tbBody > .grp:nth-child(2) .sws { width: 100%; justify-content: space-between; gap: 0; }
    #tb .sw { width: min(8.4vw, 30px); height: min(8.4vw, 30px); }
    #tb .tbBody > .grp:nth-child(3) { width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr; gap: 4px; }
    #tb .tbBody > .grp:nth-child(3) button { padding: 5px 2px; white-space: nowrap; font-size: 11px; }
    #tb .tbBody > .grp:nth-child(5) { width: 100%; justify-content: space-between; }
    #tb .tbBody > .grp:nth-child(5) .sws { gap: 0; flex: 1; justify-content: space-around; }
    #tb .tbBody > .grp:nth-child(7), #tb .tbBody > .grp:nth-child(8) { flex: 1 1 0; }
    #tb .tbBody > .grp:nth-child(7) button, #tb .tbBody > .grp:nth-child(8) button { width: 100%; white-space: nowrap; }
    #tb #activeLbl { font-size: 11.5px; max-width: none; }
    #tb #tsws .sw { width: 24px; height: 24px; }
  }

  /* ---------- Wydruk / PDF ---------- */
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff !important; }
    .subrow[data-empty] { display: none !important; }
    .tbox { outline: none !important; }

<script>
(function () {

  var DEFAULT_THEME = ['#0c3fd0', '#ff8a00', '#ffd60a'], OLD_DEFAULT_THEME = ['#243a7c', '#dc2429', '#fcea1e'], THEMES_KEY = 'mpv:gameplan:themes:v1';
  function themeObj(t) { return { c1: t[0], c2: t[1], c3: t[2] }; }
  function loadThemes() { try { var l = JSON.parse(localStorage.getItem(THEMES_KEY) || '[]'); return Array.isArray(l) ? l.filter(function (s) { return Array.isArray(s) && s.length === 3 && s.every(function (c) { return /^#[0-9a-f]{6}$/i.test(c); }); }) : []; } catch (e) { return []; } }

  function newAtkPage() { // dodatkowa strona ataku: po trzy karty w każdej sekcji

  function srvCard(n) { return { k: 'card', num: String(n), name: '', sub: '', shapes: [cone([74, 8], [38, 176], [134, 176])].concat(blockers(US_SHIRT)), notes: '' }; }
  var LEGEND = '<b>LEGENDA:</b><br><br><b>2 ball</b> – otwarta prosta (skaczemy skos)<br><b>1 ball</b> – jedna piłka między antenką a rękoma (łapka)<br><b>0 ball</b> – zamknięta prosta, żadna piłka nie przechodzi między antenką a rękoma<br><br><b>Q</b> – quick<br><b>HB</b> – wysoka<br><b>B3</b> – blok potrójny<br><b>K1</b> – krótka przy sobie<br><b>K7</b> – suw';

      meta: { ourLogo: a.logo || '', ourName: a.name || 'Nasz zespół', oppLogo: b.logo || '', oppName: b.name || 'Przeciwnik', comp: 'Rozgrywki', date: 'DD.MM.RRRR, godz. GG:MM', place: 'Miejsce meczu', footLogo: '' },

        { title: 'P1 P6 P5', note: '', cards: [distCard(), distCard()] },
        { title: 'WSZYSTKIE USTAWIENIA ŁĄCZNIE:', note: '', cards: [distCard(), distCard(), distCard(), distCard()] } ] },
      p2: { items: p2 }, p3: { items: p3 }

  }

  var doc = null;
  try { doc = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { doc = null; }
  if (!doc || !doc.p1 || !doc.p2 || !doc.p3) doc = defaultDoc();
  // migracja v3: stare, nietknięte schematy ataku (skrzydła) odbijamy na drugą stronę – zachowuje logo i wszystkie inne zmiany
  var OLD_ATK = { 'lewe skrzydło': [[58, 18], [34, 176], [112, 176]], 'prawe skrzydło – II strefa': [[182, 18], [206, 176], [128, 176]], 'prawe skrzydło – I strefa': [[172, 70], [206, 176], [132, 176]] };
  if ((doc.v || 1) < 3) {
    (doc.p2.items || []).forEach(function (c) {
      var s = c.shapes && c.shapes[0], old = OLD_ATK[c.sub];
      if (c.k === 'card' && old && s && s.t === 'cone' && JSON.stringify(s.pts) === JSON.stringify(old)) s.pts = s.pts.map(function (q) { return [240 - q[0], q[1]]; });
    });
    (doc.p3.items || []).forEach(function (c) { // koszulki w zagrywce takie same jak w ataku (nietknięte czerwone -> domyślne)

  if (!doc.colors) doc.colors = themeObj(DEFAULT_THEME);

  } // starsze zapisy bez kolorów zespołu

  // bezpieczne HTML notatek (tylko pogrubienie, kursywa, podkreślenie, kolor, łamanie linii)
  function clean(html) {
    var d = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html'), out = document.createElement('div');
    (function walk(src, dst) {
      Array.prototype.forEach.call(src.childNodes, function (n) {
        if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); return; }
        if (n.nodeType !== 1) return;
        var t = n.tagName.toLowerCase();
        if (['b', 'strong', 'i', 'em', 'u', 'br', 'div', 'p', 'span', 'font'].indexOf(t) < 0) { walk(n, dst); return; }
        var c = document.createElement(t === 'strong' ? 'b' : t === 'em' ? 'i' : (t === 'font' ? 'span' : t));
        var col = (t === 'font' && n.getAttribute('color')) || (n.style && n.style.color);
        if (col && /^(#[0-9a-f]{3,8}|rgb\([\d\s,.]+\)|[a-z]+)$/i.test(col)) c.style.color = col;
        if (n.style) {
          if (n.style.fontWeight === 'bold' || +n.style.fontWeight >= 600) c.style.fontWeight = '700';
          if (n.style.fontStyle === 'italic') c.style.fontStyle = 'italic';
          if (/underline/.test(n.style.textDecoration || '')) c.style.textDecoration = 'underline';
        }
        dst.appendChild(c); if (t !== 'br') walk(n, c);
      });
    })(d.body.firstChild, out);
    return out.innerHTML;
  }

  // ---------- Elementy HTML stron ----------
  function tx(p, cls, ph) { return '<span class="tx ' + (cls || '') + '" contenteditable="' + CE + '" spellcheck="false" data-p="' + p + '" data-ph="' + esc(ph || '') + '">' + esc(getPath(doc, p)) + '</span>'; }
  function rt(p, cls, ph) { return '<div class="rt ' + (cls || '') + '" contenteditable="true" spellcheck="false" data-p="' + p + '" data-rich="1" data-ph="' + esc(ph || '') + '">' + clean(getPath(doc, p)) + '</div>'; }
  function shirtBg(color) { return "url('data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -19 40 36"><path d="' + SHIRT_D + '" fill="' + color + '" stroke="#27406e" stroke-width="1.3" stroke-linejoin="round"/></svg>') + "')"; }
  function shIcon(numPath, color, mask) {
    return '<span class="sh" style="background-image:' + shirtBg(color || '#ffffff') + '"><span class="n" contenteditable="' + CE + '" spellcheck="false"' + (mask ? ' data-mask="' + mask + '"' : '') + ' data-p="' + numPath + '" data-ph="#">' + esc(getPath(doc, numPath)) + '</span></span>';
  }
  // pole z maską: num – tylko cyfry (max 3), name – WIELKIE LITERY (max 22), pos – skrót pozycji wielkimi literami (max 3)
  var MASK_MAX = { num: 3, name: 22, pos: 3 };
  function maskText(kind, s) {
    s = String(s);

  function subsHTML() {

    doc.p1.subs.forEach(function (r, i) {
      var b = 'p1.subs.' + i;
      h += '<div class="subrow" data-si="' + i + '"' + (r.num || r.name || r.pos ? '' : ' data-empty="1"') + '><span class="hash">#</span>' +
        mtx(b + '.num', 'sn', 'nr', 'num') + mtx(b + '.name', 'snm', 'NAZWISKO', 'name') + mtx(b + '.pos', 'spo', 'poz', 'pos') +
        '<button type="button" class="subx noprint" data-act="sub-del" data-si="' + i + '" title="Usuń zmiennika">✕</button></div>';

  }
  function normSubs() { // starszy zapis (tekst z formatowaniem) -> lista wierszy
    var s = doc.p1.subs; if (Array.isArray(s)) return;

  $('sws').addEventListener('click', function (e) {
    var s = e.target.closest('.sw'); if (!s) return; color = s.dataset.c;
    if (sel) { var sh = shapesOf(sel.path)[sel.i]; if (sh) { sh.color = color; redrawPath(sel.path); commit(); } }
    syncTb();
  });
  // trzy kolory zespołu: wpisywane jako hex (lub z próbnika), z możliwością zapisania własnego zestawu
  var THEME_ROWS = [['c1', '1 · paski sekcji i ramka nagłówka'], ['c2', '2 · belka z lewej – środek'], ['c3', '3 · belka z lewej – dół']];
  var HEX_RE = /^#[0-9a-f]{6}$/i;
  function themeChip(s, i) {
    return '<span class="thset" data-i="' + i + '" title="Użyj tego zestawu" style="display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:8px;padding:2px 4px;cursor:pointer">' +
      '<span style="display:inline-flex;width:48px;height:18px;border-radius:5px;overflow:hidden"><i style="flex:1;background:' + s[0] + '"></i><i style="flex:1;background:' + s[1] + '"></i><i style="flex:1;background:' + s[2] + '"></i></span>' +
      '<b class="thdel" data-i="' + i + '" title="Usuń zestaw" style="font-size:11px;color:var(--muted);padding:0 3px">✕</b></span>';
  }
  function openThemePop() {
    var pop = $('pop'), saved = loadThemes(), h = '<div style="font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em">Kolory zespołu</div>';
    THEME_ROWS.forEach(function (r) {
      var v = doc.colors[r[0]];
      h += '<div><label>' + r[1] + '</label><div style="display:flex;gap:6px;align-items:center"><input type="color" class="thc" data-row="' + r[0] + '" value="' + esc(v) + '" style="width:44px;height:32px;padding:2px;cursor:pointer;flex:none">' +
        '<input type="text" class="thx" data-row="' + r[0] + '" value="' + esc(v) + '" maxlength="7" spellcheck="false" placeholder="#RRGGBB" style="font-family:ui-monospace,Consolas,monospace"></div></div>';
    });
    h += '<div><button type="button" id="thSave" title="Zapisz bieżące trzy kolory jako swój zestaw – nowy gameplan startuje z ostatnio zapisanego">💾 Zapisz mój zestaw</button></div>';
    if (saved.length) h += '<div><label>Moje zestawy (kliknij, aby użyć)</label><div id="thSets" style="display:flex;flex-wrap:wrap;gap:6px;max-width:300px">' + saved.map(themeChip).join('') + '</div></div>';
    h += '<div style="display:flex;justify-content:flex-end"><button type="button" id="thOk">Gotowe</button></div>';
    pop.innerHTML = h; pop.classList.add('show');
    var r0 = $('themeBtn').getBoundingClientRect(); pop.style.left = Math.min(innerWidth - 340, Math.max(8, r0.left)) + 'px'; pop.style.top = (r0.bottom + 8) + 'px';
    pop.oninput = function (e) { // zmiana koloru na żywo
      var t = e.target, row = t.getAttribute('data-row'); if (!row) return;
      var v = t.value.trim();
      if (t.classList.contains('thx')) {
        if (v && v[0] !== '#') v = '#' + v;
        if (!HEX_RE.test(v)) { t.style.borderColor = '#d62828'; return; }
        t.style.borderColor = ''; pop.querySelector('.thc[data-row="' + row + '"]').value = v.toLowerCase();
      } else { var tx = pop.querySelector('.thx[data-row="' + row + '"]'); tx.value = v; tx.style.borderColor = ''; }
      doc.colors[row] = v.toLowerCase(); applyTheme(); commitSoon();
    };
    pop.onclick = function (e) {
      var l, c = doc.colors;
      if (e.target.id === 'thSave') {
        l = loadThemes(); var cur = [c.c1, c.c2, c.c3];
        l = l.filter(function (s) { return s.join() !== cur.join(); }); l.push(cur); if (l.length > 8) l.shift(); saveThemes(l);
        toast('Zapisano zestaw kolorów. Nowe gameplany będą startować z tego zestawu.'); openThemePop();
      } else if (e.target.closest('.thdel')) {
        l = loadThemes(); l.splice(+e.target.closest('.thdel').dataset.i, 1); saveThemes(l); openThemePop();
      } else if (e.target.closest('.thset')) {
        var t = loadThemes()[+e.target.closest('.thset').dataset.i]; if (t) { doc.colors = themeObj(t); applyTheme(); commit(); openThemePop(); }
      } else if (e.target.id === 'thOk') { commit(); closePop(); }
    };
  }
  $('themeBtn').addEventListener('click', openThemePop);
  // kopiowanie kształtów między boiskami: zaznaczony kształt albo (bez zaznaczenia) wszystkie kształty aktywnego diagramu
  var clip = null, clipSrc = null;
  function copyShapes() {
    if (sel && shapesOf(sel.path)[sel.i]) { clip = [clone(shapesOf(sel.path)[sel.i])]; clipSrc = sel.path; toast('Skopiowano zaznaczony kształt. Kliknij inne boisko i wklej (Ctrl+V).'); }
    else if (activePath && shapesOf(activePath).length) { clip = clone(shapesOf(activePath)); clipSrc = activePath; toast('Skopiowano wszystkie kształty (' + clip.length + ') z diagramu. Kliknij inne boisko i wklej.'); }
    else toast('Zaznacz kształt albo kliknij diagram, z którego chcesz kopiować.');
  }
  function pasteShapes() {
    if (!clip || !clip.length) { toast('Schowek jest pusty – najpierw skopiuj kształty.'); return; }
    if (!activePath) { toast('Kliknij boisko, do którego chcesz wkleić.'); return; }
    var arr = shapesOf(activePath), off = activePath === clipSrc ? 10 : 0, first = arr.length;
    clone(clip).forEach(function (s) {
      if (activePath === FORM_PATH && s.t === 'shirt') return; // koszulek nie wklejamy do schematu ustawienia
      if (off) { if (s.pts) s.pts = s.pts.map(function (q) { return [q[0] + off, q[1] + off]; }); else { s.x += off; s.y += off; } }
      arr.push(s);
    });
    sel = { path: activePath, i: arr.length - 1 }; redrawPath(activePath); commit(); toast('Wklejono ' + (arr.length - first) + ' kształt(y).');
  }
  $('copyBtn').addEventListener('click', copyShapes); $('pasteBtn').addEventListener('click', pasteShapes);
  // formatowanie tekstu: przyciski nie odbierają fokusu z edytowanego pola
  $('tb').addEventListener('mousedown', function (e) { if (e.target.closest('[data-cmd], [data-tc]')) e.preventDefault(); });
  $('tb').addEventListener('click', function (e) {
    var c = e.target.closest('[data-cmd]'), t = e.target.closest('[data-tc]');
    if (c) document.execCommand(c.dataset.cmd, false, null); else if (t) document.execCommand('foreColor', false, t.dataset.tc);
    if (c || t) { var a = document.activeElement; if (a && a.getAttribute && a.getAttribute('data-rich')) { setPath(doc, a.getAttribute('data-p'), clean(a.innerHTML)); commitSoon(); } }
  });
  $('delShape').addEventListener('click', delSel);
  function delSel() { if (!sel) return; if (isLocked(sel.path, shapesOf(sel.path)[sel.i])) { toast('Koszulek w schemacie ustawienia przeciwnika nie usuwamy.'); return; } shapesOf(sel.path).splice(sel.i, 1); var p = sel.path; sel = null; redrawPath(p); commit(); }
  $('clearCanvas').addEventListener('click', function () {
    if (!activePath) { toast('Najpierw kliknij diagram, który chcesz wyczyścić.'); return; }
    var keep = activePath === FORM_PATH ? shapesOf(activePath).filter(function (s) { return s.t === 'shirt'; }) : []; // w schemacie ustawienia koszulki zostają
    if (shapesOf(activePath).length === keep.length) return; setPath(doc, activePath, keep); sel = null; redrawPath(activePath); commit();
  });
  document.addEventListener('keydown', function (e) {
    var tg = e.target && e.target.tagName, editing = e.target && (e.target.isContentEditable || tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA');
    if ((e.ctrlKey || e.metaKey) && !editing) {
      var k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); $('undoBtn').click(); } else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); $('redoBtn').click(); }
      else if (k === 'c' && !String(window.getSelection()).length) { e.preventDefault(); copyShapes(); }
      else if (k === 'v') { e.preventDefault(); pasteShapes(); }
      return;
    }
    if (editing) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); delSel(); }
    else if (e.key === 'Escape') { sel = null; conePts = null; cur = null; clearPreview(); closePop(); drawAll(); setInserting(false); }
  });

  // ---------- Widok (zoom) ----------
  var zoom = 0; // 0 = dopasuj
  function fit() {
    var avail = Math.max(280, stage.clientWidth - 24), s = zoom || Math.min(1, avail / 794);
    stage.style.setProperty('--s', s.toFixed(3)); $('zoomVal').textContent = Math.round(s * 100) + '%';
  }
  $('zoomIn').addEventListener('click', function () { var s = parseFloat(stage.style.getPropertyValue('--s')) || 1; zoom = Math.min(2, Math.round((s + 0.1) * 100) / 100); fit(); });
  $('zoomOut').addEventListener('click', function () { var s = parseFloat(stage.style.getPropertyValue('--s')) || 1; zoom = Math.max(0.3, Math.round((s - 0.1) * 100) / 100); fit(); });
  $('zoomFit').addEventListener('click', function () { zoom = 0; fit(); });
  addEventListener('resize', function () { if (!zoom) fit(); });

  // ---------- Plik, nowy, PDF ----------
  $('newBtn').addEventListener('click', function () {
    if (!confirm('Utworzyć nowy, pusty gameplan? Bieżący zostanie zastąpiony (cofnięcie: Ctrl+Z).')) return;
    doc = defaultDoc(); sel = null; activePath = null; $('activeLbl').textContent = activeName(); renderAll(); commit();
  });
  $('saveBtn').addEventListener('click', function () {
    var d = new Date(), name = 'gameplan-' + d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + '.json';
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(doc)], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); toast('Zapisano plik ' + name);
  });
  $('loadBtn').addEventListener('click', function () { $('loadFile').value = ''; $('loadFile').click(); });
  $('loadFile').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return; var fr = new FileReader();
    fr.onload = function () {
      try { var d = JSON.parse(fr.result); if (!d || !d.p1 || !d.p2 || !d.p3 || !d.meta) throw new Error('bad'); doc = d; sel = null; renderAll(); commit(); toast('Wczytano gameplan.'); }
      catch (e) { toast('To nie jest poprawny plik gameplanu.'); }
    };
    fr.readAsText(f);
  });
  $('printBtn').addEventListener('click', function () {
    toast('W oknie drukowania wybierz „Zapisz jako PDF”, papier A4, marginesy: brak.');
    setTimeout(function () { document.body.classList.add('printing'); var a = document.activeElement; if (a && a.blur) a.blur(); window.print(); document.body.classList.remove('printing'); }, 350);
  });

  renderAll();
  hist = [JSON.stringify(doc)]; hi = 0; histOn = true; syncHist();
})();
</script>
</body>
</html>
