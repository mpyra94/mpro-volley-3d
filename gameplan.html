<style>
  :root {
    color-scheme: dark;
    --bg: #0f1720; --glass: rgba(15, 22, 31, 0.9); --line: #2a3644;
    --text: #e6edf3; --muted: #8b98a5; --accent: #f2b33d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; }
  .box { background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
    padding: 40px 32px; max-width: 420px; text-align: center; }
  .ico { font-size: 44px; margin-bottom: 6px; }
  h1 { font-size: 20px; margin: 4px 0 8px; }
  p { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 0 0 22px; }
  button { font: inherit; color: var(--text); background: #1c2633; border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  a { text-decoration: none; }
</style>
</head>
<body>
<script>
var SHARED_TEAMS_KEY = 'mpv:teams';
var TEAM_SHARED_FIELDS = ['name', 'logo', 'jersey', 'shorts', 'libero', 'shoes', 'gender', 'floorLogo'];
var DEFAULT_SHARED_TEAMS = {
  a: { jersey: '#d94848', shorts: '#2b2b33', libero: '#f2d23d', shoes: '#f0f0f0', name: '', logo: '', gender: 'm', floorLogo: true },
  b: { jersey: '#3b7ddd', shorts: '#1d2a44', libero: '#3fd08a', shoes: '#222831', name: '', logo: '', gender: 'm', floorLogo: true },
};
function loadSharedTeams() {
  try { return JSON.parse(localStorage.getItem(SHARED_TEAMS_KEY) || 'null'); }
  catch (e) { return null; }
}
function saveSharedTeams(teamsObj) {
  var out = {};
  ['a', 'b'].forEach(function (t) {
    out[t] = {};
    TEAM_SHARED_FIELDS.forEach(function (k) { out[t][k] = teamsObj[t][k]; });
  });
  try { localStorage.setItem(SHARED_TEAMS_KEY, JSON.stringify(out)); } catch (e) {}
}
</script>
<div class="box">
  <div class="ico">📄</div>
  <h1>Gameplan</h1>
  <p>Generator planu meczu w PDF jest w przygotowaniu. Wkrótce znajdziesz tu tę funkcję.</p>

</div>
</body>
</html>
